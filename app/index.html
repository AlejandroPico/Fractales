<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03050c" />
    <meta name="description" content="Biblioteca inmersiva de fractales 2D y 3D acelerada por GPU." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Fractales — Biblioteca inmersiva</title>

    <style>
      #startup-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;background:#02040b;color:#f2f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:1;visibility:visible;transition:opacity .55s cubic-bezier(.2,.8,.2,1),visibility .55s linear;pointer-events:none}
      #startup-screen::before{content:"";position:absolute;inset:-18%;background:radial-gradient(circle at 50% 46%,rgba(45,95,151,.18),transparent 31%),repeating-linear-gradient(60deg,transparent 0 56px,rgba(129,216,255,.025) 57px 58px),repeating-linear-gradient(-60deg,transparent 0 56px,rgba(129,216,255,.018) 57px 58px);transform:scale(1.08);animation:start-drift 9s ease-in-out infinite alternate}
      #startup-screen.is-complete{opacity:0;visibility:hidden}
      .startup-shell{position:relative;width:min(560px,calc(100vw - 48px));display:grid;justify-items:center;text-align:center}
      .startup-symbol{width:76px;height:66px;margin-bottom:28px;opacity:.88;filter:drop-shadow(0 0 22px rgba(107,220,255,.16))}
      .startup-symbol path{fill:none;stroke:#bfefff;stroke-width:1.1;vector-effect:non-scaling-stroke}
      .startup-kicker{margin:0 0 7px;color:#7890ad;font-size:.66rem;font-weight:760;letter-spacing:.2em;text-transform:uppercase}
      .startup-title{margin:0;color:#f7faff;font-size:clamp(2.4rem,7vw,4.8rem);font-weight:350;letter-spacing:-.055em;line-height:.94}
      .startup-subtitle{margin:13px 0 36px;color:#8496ae;font-size:.72rem;font-weight:560;letter-spacing:.11em;text-transform:uppercase}
      .startup-progress{width:100%;height:1px;overflow:visible;background:rgba(255,255,255,.12)}
      .startup-progress__fill{position:relative;width:4%;height:1px;background:#bcecff;box-shadow:0 0 12px rgba(137,225,255,.48);transition:width .42s cubic-bezier(.2,.75,.2,1)}
      .startup-progress__fill::after{content:"";position:absolute;top:-2px;right:0;width:5px;height:5px;background:#e4f8ff;box-shadow:0 0 12px rgba(169,236,255,.8)}
      .startup-meta{width:100%;display:flex;justify-content:space-between;gap:16px;margin-top:12px;color:#63758e;font-size:.64rem;font-variant-numeric:tabular-nums;letter-spacing:.06em;text-transform:uppercase}
      #startup-status{text-align:left}
      #startup-percent{color:#9caec2;text-align:right}
      @keyframes start-drift{from{transform:scale(1.06) translate3d(-.5%,0,0)}to{transform:scale(1.11) translate3d(.5%,-.5%,0)}}
      @media(max-width:520px){.startup-shell{width:calc(100vw - 36px)}.startup-symbol{width:62px;height:54px;margin-bottom:24px}.startup-subtitle{margin-bottom:30px}}
      @media(prefers-reduced-motion:reduce){#startup-screen::before{animation:none}#startup-screen,.startup-progress__fill{transition-duration:.01ms}}
    </style>

    <script>
      (() => {
        let progress = 4;
        const phases = [
          [18, 'Cargando biblioteca matemática'],
          [34, 'Preparando recursos gráficos'],
          [49, 'Inicializando precisión extendida'],
          [63, 'Preparando motor GPU'],
          [72, 'Compilando entorno visual']
        ];
        let phase = 0;

        const paint = () => {
          const fill = document.getElementById('startup-progress-fill');
          const percent = document.getElementById('startup-percent');
          const status = document.getElementById('startup-status');
          if (!fill || !percent || !status) return;
          fill.style.width = `${progress}%`;
          percent.textContent = `${Math.round(progress)}%`;
          if (phase < phases.length && progress >= phases[phase][0]) {
            status.textContent = phases[phase][1];
            phase += 1;
          }
        };

        window.__fractalesStartup = {
          set(value, label) {
            progress = Math.max(progress, Math.min(100, value));
            requestAnimationFrame(() => {
              const status = document.getElementById('startup-status');
              if (status && label) status.textContent = label;
              paint();
            });
          },
          complete() {
            progress = 100;
            requestAnimationFrame(() => {
              const fill = document.getElementById('startup-progress-fill');
              const percent = document.getElementById('startup-percent');
              const status = document.getElementById('startup-status');
              if (fill) fill.style.width = '100%';
              if (percent) percent.textContent = '100%';
              if (status) status.textContent = 'Entorno preparado';
              setTimeout(() => document.getElementById('startup-screen')?.classList.add('is-complete'), 180);
              setTimeout(() => document.getElementById('startup-screen')?.remove(), 900);
            });
          },
          error(message) {
            const status = document.getElementById('startup-status');
            if (status) status.textContent = message || 'Error de inicialización';
          }
        };

        const timer = setInterval(() => {
          if (progress >= 72) {
            clearInterval(timer);
            return;
          }
          progress = Math.min(72, progress + Math.max(.7, (72 - progress) * .055));
          paint();
        }, 140);

        document.addEventListener('DOMContentLoaded', paint, { once: true });
      })();
    </script>

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js"}}</script>
  </head>
  <body>
    <section id="startup-screen" aria-live="polite" aria-label="Inicializando Fractales">
      <div class="startup-shell">
        <svg class="startup-symbol" viewBox="0 0 96 84" aria-hidden="true">
          <path d="M48 3 93 81H3L48 3Z"/>
          <path d="M48 29 63 55H33L48 29Z"/>
          <path d="M25.5 42 48 81H3L25.5 42Z"/>
          <path d="M70.5 42 93 81H48L70.5 42Z"/>
        </svg>
        <p class="startup-kicker">Biblioteca matemática inmersiva</p>
        <h1 class="startup-title">Fractales</h1>
        <p class="startup-subtitle">Geometría infinita · 2D / 3D · GPU</p>
        <div class="startup-progress" aria-hidden="true"><div class="startup-progress__fill" id="startup-progress-fill"></div></div>
        <div class="startup-meta"><span id="startup-status">Iniciando aplicación</span><span id="startup-percent">4%</span></div>
      </div>
    </section>

    <canvas id="viewport" aria-label="Explorador inmersivo de fractales"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
